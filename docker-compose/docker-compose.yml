services:
  cagent:
    image: docker/cagent:latest
    command: ["api", "/examples/code.yaml", "--listen", ":8080"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - METRICS_ADDR=${METRICS_ADDR:-:9090}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ../examples:/examples:ro
    ports:
      - "8080:8080"
    depends_on:
      - duckduckgo
      - github-official
      - jaeger
      - prometheus

  duckduckgo:
    image: ${MCP_DUCKDUCKGO_IMAGE:-docker/mcp-server-duckduckgo:latest}
    ports:
      - "8081:8080"

  github-official:
    image: ${MCP_GITHUB_IMAGE:-docker/mcp-server-github-official:latest}
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    ports:
      - "8082:8080"

  jaeger:
    image: jaegertracing/jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    command: ["--set", "service.telemetry.logs.level=error"]
    environment:
      - OTEL_TRACES_SAMPLER=always_off

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
